<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Pro - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* Background com imagem de floresta - EXATAMENTE como a referência */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1511497584788-876760111969?w=1920&q=80') center center / cover no-repeat;
            z-index: 0;
        }

        /* Overlay SUTIL - apenas para escurecer a base e manter legibilidade */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.0) 0%,
                rgba(0, 0, 0, 0.1) 35%,
                rgba(0, 0, 0, 0.35) 60%,
                rgba(0, 0, 0, 0.65) 100%
            );
            z-index: 1;
        }

        /* Container principal */
        .login-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 650px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Título FINANCE PRO - interativo com background */
        .title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.2rem, 5.5vw, 4.2rem);
            font-weight: 800;
            letter-spacing: 0.15em;
            line-height: 1.05;
            margin-bottom: 28px;
            text-transform: uppercase;

            /* Efeito: floresta aparecendo através do texto */
            background: url('https://images.unsplash.com/photo-1511497584788-876760111969?w=1920&q=80') center center / cover no-repeat;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;

            /* Brilho e sombra para destacar como na referência */
            filter: brightness(1.1) contrast(1.1);
            text-shadow: 0 0 30px rgba(255,255,255,0.15), 0 4px 20px rgba(0,0,0,0.4);

            /* Posiciona o background do texto para alinhar com as árvores */
            background-position: center 45%;
        }

        /* Frases minimalistas - fonte Inter igual ao botão */
        .subtitle {
            font-family: 'Inter', sans-serif;
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(0.95rem, 2.2vw, 1.2rem);
            font-weight: 500;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 0.01em;
            line-height: 1.4;
        }

        .description {
            font-family: 'Inter', sans-serif;
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(0.75rem, 1.7vw, 0.9rem);
            font-weight: 300;
            margin-bottom: 32px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
            letter-spacing: 0.01em;
        }

        /* Botão principal - estilo "Login com Google" */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            padding: 11px 28px;
            border-radius: 50px;
            font-size: clamp(0.82rem, 1.8vw, 0.92rem);
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            background: #f5f5f5;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Ícone do Google */
        .google-icon {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-container {
                padding: 16px;
                width: 95%;
            }

            .title {
                letter-spacing: 0.1em;
                margin-bottom: 22px;
                background-position: center 48%;
            }

            .subtitle {
                margin-bottom: 4px;
            }

            .description {
                margin-bottom: 26px;
            }

            .btn-primary {
                padding: 10px 24px;
                gap: 8px;
            }

            .google-icon {
                width: 15px;
                height: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Container de Login -->
    <div class="login-container">
        <!-- Título interativo com background -->
        <h1 class="title">FINANCE PRO</h1>

        <!-- Frases minimalistas -->
        <p class="subtitle">Gerencie suas finanças com inteligência</p>
        <p class="description">Acesse sua conta para começar</p>

        <!-- Botão de Login com Google -->
        <button class="btn-primary" onclick="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Login com Google
        </button>
    </div>

    <script>
        function loginWithGoogle() {
            console.log('Iniciando login com Google...');
        }
    </script>
</body>
</html>

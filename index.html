<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Pro — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0d1a0d;
        }

        /* === FUNDO: Floresta verde densa === */
        .background {
            position: fixed;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=85') center center / cover no-repeat;
            z-index: 0;
            transform: scale(1.05);
            transition: transform 0.3s ease-out;
        }

        /* === OVERLAY: Gradiente harmonioso === */
        .overlay {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 60%),
                linear-gradient(to bottom, rgba(13,26,13,0.2) 0%, rgba(13,26,13,0.5) 50%, rgba(10,18,10,0.85) 100%);
            z-index: 1;
        }

        /* === CONTAINER === */
        .login-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 24px;
            max-width: 520px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* === TÍTULO: FINANCE PRO — interativo com fundo === */
        .title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: 0.18em;
            line-height: 1.0;
            margin-bottom: 18px;
            text-transform: uppercase;
            position: relative;
            color: rgba(245, 250, 245, 0.85);
            text-shadow: 
                0 2px 20px rgba(0,0,0,0.5),
                0 0 60px rgba(180,210,180,0.2);
        }

        /* Efeito interativo: floresta brilhando através do texto */
        .title::after {
            content: 'FINANCE PRO';
            position: absolute;
            inset: 0;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            letter-spacing: inherit;
            line-height: inherit;
            text-transform: inherit;
            background: linear-gradient(
                180deg,
                rgba(255,255,255,0.0) 0%,
                rgba(255,255,255,0.0) 40%,
                rgba(200,230,200,0.3) 70%,
                rgba(160,200,160,0.5) 100%
            );
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* === SUBTÍTULO: Mesma fonte leve da descrição === */
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: rgba(230, 245, 230, 0.88);
            font-size: clamp(0.9rem, 2.2vw, 1.15rem);
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.35);
            letter-spacing: 0.03em;
            line-height: 1.5;
        }

        /* === DESCRIÇÃO === */
        .description {
            font-family: 'Inter', sans-serif;
            color: rgba(200, 220, 200, 0.55);
            font-size: clamp(0.78rem, 1.7vw, 0.88rem);
            font-weight: 300;
            margin-bottom: 36px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.02em;
        }

        /* === BOTÃO GOOGLE === */
        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a2e1a;
            border: none;
            padding: 13px 34px;
            border-radius: 100px;
            font-size: clamp(0.88rem, 1.9vw, 0.98rem);
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 20px rgba(0,0,0,0.25),
                0 0 0 1px rgba(255,255,255,0.1);
            text-decoration: none;
            letter-spacing: -0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn-google::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .btn-google:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 12px 40px rgba(0,0,0,0.35),
                0 0 0 1px rgba(255,255,255,0.15);
            background: #ffffff;
        }

        .btn-google:hover::before {
            opacity: 1;
        }

        .btn-google:active {
            transform: translateY(-1px) scale(0.98);
        }

        .google-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        /* === RESPONSIVO === */
        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
                width: 95%;
                gap: 4px;
            }

            .title {
                letter-spacing: 0.12em;
                margin-bottom: 14px;
            }

            .subtitle {
                margin-bottom: 2px;
            }

            .description {
                margin-bottom: 28px;
            }

            .btn-google {
                padding: 12px 28px;
                gap: 10px;
                width: 100%;
                max-width: 260px;
            }

            .google-icon {
                width: 16px;
                height: 16px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .login-container {
                padding: 22px;
            }

            .title {
                letter-spacing: 0.14em;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="login-container">
        <h1 class="title">FINANCE PRO</h1>

        <p class="subtitle">Gerencie suas finanças com inteligência</p>
        <p class="description">Acesse sua conta para começar</p>

        <button class="btn-google" onclick="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span class="btn-text">Login com Google</span>
        </button>
    </div>

    <script>
        function loginWithGoogle() {
            console.log('Iniciando login com Google...');
        }

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 8;
            const y = (e.clientY / window.innerHeight - 0.5) * 8;
            document.querySelector('.background').style.transform = 
                `translate(${x}px, ${y}px) scale(1.05)`;
        });
    </script>
</body>
</html>
